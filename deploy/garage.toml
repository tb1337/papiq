# Single-node Garage for the example stack. The RPC secret and the admin token come from the
# files named by GARAGE_RPC_SECRET_FILE and GARAGE_ADMIN_TOKEN_FILE (see compose.postgres.yml).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"

[admin]
api_bind_addr = "0.0.0.0:3903"
