[project]
name = "papiq"
version = "0.1.0"
description = "Self-hosted, headless document management system"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "import-linter",
    "mypy",
    "pytest",
    "pytest-asyncio>=1.4.0",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: needs no external services (applied automatically to tests/unit)",
    "integration: needs Postgres, Garage or Meilisearch (applied automatically to tests/integration)",
]

# Hexagonal boundaries, checked with `lint-imports`.
[tool.importlinter]
root_package = "papiq"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: composition -> adapters -> core"
type = "layers"
layers = [
    "papiq.composition",
    "papiq.adapters",
    "papiq.core",
]

[[tool.importlinter.contracts]]
name = "Inbound and outbound adapters are independent"
type = "independence"
modules = [
    "papiq.adapters.inbound",
    "papiq.adapters.outbound",
]

[[tool.importlinter.contracts]]
name = "Domain model depends on nothing else in the core"
type = "forbidden"
source_modules = ["papiq.core.domain"]
forbidden_modules = ["papiq.core.ports", "papiq.core.services"]

[[tool.importlinter.contracts]]
name = "Core is plain Python: no framework or client libraries"
type = "forbidden"
source_modules = ["papiq.core"]
forbidden_modules = [
    "aiosqlite",
    "alembic",
    "asyncpg",
    "authlib",
    "boto3",
    "botocore",
    "docling",
    "fastapi",
    "httpx",
    "meilisearch",
    "ocrmypdf",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "starlette",
    "structlog",
    "uvicorn",
]
