[project]
name = "papiq"
version = "0.1.0"
description = "Self-hosted, headless document management system"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.2",
    "docling>=2.134.0",
    "fastapi>=0.142.2",
    "ocrmypdf>=17.13.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyotp>=2.10.0",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.3",
    "structlog>=26.1.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter",
    "mypy",
    "pytest",
    "pytest-asyncio>=1.4.0",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: needs no external services (applied automatically to tests/unit)",
    "integration: needs Postgres, Garage, Meilisearch, OCR programs or Docling models (applied automatically to tests/integration)",
    "docling: slow, runs Docling; deselect with -m 'not docling'",
]

# Hexagonal boundaries, checked with `lint-imports`.
[tool.importlinter]
root_package = "papiq"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: composition -> adapters -> core"
type = "layers"
layers = [
    "papiq.composition",
    "papiq.adapters",
    "papiq.core",
]

[[tool.importlinter.contracts]]
name = "Inbound and outbound adapters are independent"
type = "independence"
modules = [
    "papiq.adapters.inbound",
    "papiq.adapters.outbound",
]

[[tool.importlinter.contracts]]
name = "Domain model depends on nothing else in the core"
type = "forbidden"
source_modules = ["papiq.core.domain"]
forbidden_modules = ["papiq.core.ports", "papiq.core.services"]

[[tool.importlinter.contracts]]
name = "Core is plain Python: no framework or client libraries"
type = "forbidden"
source_modules = ["papiq.core"]
forbidden_modules = [
    "aioboto3",
    "aiobotocore",
    "aiosqlite",
    "alembic",
    "argon2",
    "asyncpg",
    "authlib",
    "boto3",
    "botocore",
    "cryptography",
    "docling",
    "fastapi",
    "httpx",
    "meilisearch",
    "ocrmypdf",
    "PIL",
    "pydantic",
    "pydantic_settings",
    "pyotp",
    "pypdfium2",
    "python_multipart",
    "sqlalchemy",
    "starlette",
    "structlog",
    "torch",
    "uvicorn",
]

# Libraries without type information.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "aiobotocore.*", "botocore.*", "pypdfium2.*"]
ignore_missing_imports = true

# PyTorch (pulled in by Docling) in its CPU variant only, on Linux (devcontainer, image).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
