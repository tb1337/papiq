[project]
name = "papiq"
version = "0.1.0"
description = "Self-hosted, headless document management system"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "import-linter",
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Hexagonal boundaries, checked with `lint-imports`.
[tool.importlinter]
root_package = "papiq"

[[tool.importlinter.contracts]]
name = "Layers: composition -> adapters -> core"
type = "layers"
layers = [
    "papiq.composition",
    "papiq.adapters",
    "papiq.core",
]

[[tool.importlinter.contracts]]
name = "Inbound and outbound adapters are independent"
type = "independence"
modules = [
    "papiq.adapters.inbound",
    "papiq.adapters.outbound",
]

[[tool.importlinter.contracts]]
name = "Domain model depends on nothing else in the core"
type = "forbidden"
source_modules = ["papiq.core.domain"]
forbidden_modules = ["papiq.core.ports", "papiq.core.services"]
