---
name: Release Drafter

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:

# The default token of this repository may only read; the drafter writes the release draft and
# reads the pull requests.
permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    name: 📝 Draft release
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Run Release Drafter
        uses: release-drafter/release-drafter@v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
